name: CI

on: [push, pull_request]

jobs:
  preflight:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run desktop:check
      - name: Worker bundle is browser compatible
        run: npm run build:worker
      - name: CLI starts from the built package
        run: node dist/cli.js --help
      - name: The package ships the tool only, no content
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("pack.json", "utf8"))[0].files.map((f) => f.path);
            const content = files.filter((p) => /^(claude-code|skills|catalog|templates|prompts|standards|evals)\//.test(p));
            if (content.length) { console.error("Content in the npm package:\n" + content.join("\n")); process.exit(1); }
            console.log(files.length + " files, no content");
          '

  desktop:
    name: desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-latest
          - platform: windows-x64
            runner: windows-latest
          - platform: linux-x64
            runner: ubuntu-24.04
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Linux graphical runtime dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - run: npm run desktop:check
      - name: Native command and credential regressions
        run: npx vitest run tests/desktop.test.ts tests/worker.test.ts
      - name: Real Electron workflows
        if: runner.os != 'Linux'
        run: npm run desktop:smoke
      - name: Real Electron workflows under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run desktop:smoke
      - name: Build unsigned native application
        run: npm run desktop:pack -- --config.mac.notarize=false
      - name: Test the packaged application
        if: runner.os != 'Linux'
        run: npm run desktop:smoke:packaged
      - name: Test the packaged application under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run desktop:smoke:packaged
      - name: Build installers without publishing
        run: npm run desktop:dist -- --config.mac.notarize=false
      - name: Record installer hashes
        run: npm run desktop:manifest
      - uses: actions/upload-artifact@v4
        with:
          name: preflight-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            desktop-release/*.dmg
            desktop-release/*.zip
            desktop-release/*.exe
            desktop-release/*.AppImage
            desktop-release/*.deb
            desktop-release/manifest.json
            desktop-release/SHA256SUMS

  docs:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: docs}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: docs/package-lock.json}
      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run backend:smoke
      - run: npm run smoke:worker
